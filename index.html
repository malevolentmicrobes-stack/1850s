<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Back to the 1850s</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: sticky tab bar over a single centered stage; each model is a hash-routed view with its figure, legend and sources. */
:root{
  --bg:#F5F7F6;--surface:#FFFFFF;--surface2:#F9FAF8;--fg:#1B2A4A;--muted:#5A6478;--faint:#8A93A3;--line:#D6DCE2;--grid:#E3E7EA;
  --accent:#2A9D8F;--accent-ink:#FFFFFF;
  --good:#1D9E75;--warn:#E08E0B;--bad:#D62828;--ok:#1B2A4A;
  --t-spore:#A32D2D;--t-myco:#993556;--t-nonenv:#993C1D;--t-fungi:#854F0B;--t-veg:#0F6E56;--t-env:#185FA5;
  --b-spore:#FCEBEB;--b-myco:#FBEAF0;--b-nonenv:#FAECE7;--b-fungi:#FAEEDA;--b-veg:#E1F5EE;--b-env:#E6F1FB;
  --s-spore:#E24B4A;--s-myco:#D4537E;--s-nonenv:#D85A30;--s-fungi:#BA7517;--s-veg:#1D9E75;--s-env:#378ADD;
  --r-contact:#1D9E75;--r-enteric:#D85A30;--r-droplet:#7F77DD;--r-air:#378ADD;--r-blood:#D4537E;--r-water:#1F6F8B;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1524;--surface:#142035;--surface2:#18263E;--fg:#E7EDF6;--muted:#A3AFC2;--faint:#7C889C;--line:#2C3B57;--grid:#22304A;
  --accent:#4FC1B3;--accent-ink:#0D1524;--good:#4CC79E;--warn:#F2B13C;--bad:#F07070;--ok:#9DB7E0;
  --t-spore:#F09595;--t-myco:#ED93B1;--t-nonenv:#F0997B;--t-fungi:#FAC775;--t-veg:#5DCAA5;--t-env:#85B7EB;
  --b-spore:#4A1616;--b-myco:#46172A;--b-nonenv:#47200F;--b-fungi:#3E2806;--b-veg:#0A3A30;--b-env:#0E2F52;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1524;--surface:#142035;--surface2:#18263E;--fg:#E7EDF6;--muted:#A3AFC2;--faint:#7C889C;--line:#2C3B57;--grid:#22304A;
  --accent:#4FC1B3;--accent-ink:#0D1524;--good:#4CC79E;--warn:#F2B13C;--bad:#F07070;--ok:#9DB7E0;
  --t-spore:#F09595;--t-myco:#ED93B1;--t-nonenv:#F0997B;--t-fungi:#FAC775;--t-veg:#5DCAA5;--t-env:#85B7EB;
  --b-spore:#4A1616;--b-myco:#46172A;--b-nonenv:#47200F;--b-fungi:#3E2806;--b-veg:#0A3A30;--b-env:#0E2F52;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;max-width:1320px;margin:0 auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;box-shadow:14px 0 0 var(--warn),28px 0 0 var(--accent);margin-right:30px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
.tabs a{padding:7px 11px;border-radius:7px;text-decoration:none;font-size:13.5px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs a:hover{background:var(--surface2);color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.tabs .sep{width:1px;background:var(--line);margin:6px 4px;flex:none}
.theme{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.theme span{display:inline-block;width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--fg) 50%,var(--bg) 50%);border:1px solid var(--fg)}
main{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.view-head h2{font-size:30px;line-height:1.1}
.q{color:var(--muted);max-width:68ch;margin:6px 0 0}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.final{border-color:var(--accent);color:var(--accent)}
.chip.inter{border-color:var(--warn);color:var(--warn)}
.chip.old{border-style:dashed}
.layout.full{grid-template-columns:minmax(0,1fr)}.layout.full .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;min-width:0}
.fig svg{display:block;width:100%;height:auto;min-width:640px}
.fig.narrow svg{min-width:0}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side h3{font-size:15px;margin-bottom:6px}
.side p,.side li{color:var(--muted);font-size:14px;margin:0}
.side ul{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:4px}
.key{display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--muted)}
.key div{display:flex;align-items:center;gap:10px}
.sw{width:30px;height:10px;border-radius:2px;flex:none}
.ln{width:30px;height:0;border-top:3px dashed;flex:none}
.ln.solid{border-top-style:solid}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid}
.sources{font-size:12.5px;color:var(--faint);margin-top:14px;max-width:110ch}
.note{border-left:3px solid var(--warn);padding:6px 0 6px 12px;font-size:13.5px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lab{font-size:12.5px;color:var(--faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.cards2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:640px){.cards2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px}
/* svg text */
svg text{font-family:var(--font-body)}
.tx{fill:var(--fg)}.tm{fill:var(--muted)}.tf{fill:var(--faint)}
.mono{font-family:var(--font-mono)!important;letter-spacing:.08em}
.it{font-style:italic}
.hl .dimmable{transition:opacity .15s}
.hl.focus .dimmable:not(.on){opacity:.12}
.node{cursor:pointer}
/* home */
.hero{padding-block:28px 26px;border-bottom:1px solid var(--line);margin-bottom:26px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(40px,7vw,76px);line-height:.95}
.hero h1 em{font-style:normal;color:var(--bad)}
.hero p{color:var(--muted);font-size:17px;max-width:56ch;margin:14px 0 0}
.ledger{font-family:var(--font-mono);font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}
.ledger b{color:var(--fg);font-weight:500}
.group{margin-top:26px}
.group h2{font-size:20px;margin-bottom:12px;display:flex;gap:10px;align-items:baseline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card:hover{border-color:var(--fg)}
.card h3{font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wash{margin-top:34px;background:var(--fg);color:var(--bg);border-radius:12px;padding:22px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}
.wash h2{font-size:clamp(28px,5vw,44px)}
.wash p{margin:0;max-width:52ch;opacity:.85}
.range{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.range input{width:200px}
.quantum{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start;margin-top:22px}
@media (max-width:980px){.quantum{grid-template-columns:minmax(0,1fr)}}
.quantum h2{font-size:34px;margin-top:4px}
.quantum .fig svg{min-width:760px}
.qdl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 14px;font-size:14px}.qdl dt{font-weight:600}.qdl dd{margin:0;color:var(--muted)}
.q-intro .key{margin-bottom:10px}
.pill:disabled{opacity:.55;cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("atlas-theme2")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>

<header class="bar"><div class="bar-in">
  <a class="brand" href="#home"><i aria-hidden="true"></i>1850s</a>
  <nav class="tabs" id="tabs" aria-label="Models"></nav>
  <button class="theme" id="theme" type="button" aria-label="Switch light or dark"><span aria-hidden="true"></span><b id="themeLab">Dark</b></button>
</div></header>
<main id="main"></main>

<script>
/* ---------- data ---------- */
const LM=Math.log10(26280);
const L=h=>Math.log10(Math.max(h,1));
const f=n=>(+n).toFixed(1);
const P=(cx,cy,r,a)=>{const t=(a-90)*Math.PI/180;return[cx+r*Math.cos(t),cy+r*Math.sin(t)]};
const arc=(cx,cy,r,a1,a2)=>{const[x1,y1]=P(cx,cy,r,a1),[x2,y2]=P(cx,cy,r,a2);return`M${f(x1)} ${f(y1)} A${r} ${r} 0 ${a2-a1>180?1:0} 1 ${f(x2)} ${f(y2)}`};
const sect=(cx,cy,r1,r2,a1,a2)=>{const[x1,y1]=P(cx,cy,r1,a1),[x2,y2]=P(cx,cy,r2,a1),[x3,y3]=P(cx,cy,r2,a2),[x4,y4]=P(cx,cy,r1,a2);const lg=a2-a1>180?1:0;return`M${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)} A${r2} ${r2} 0 ${lg} 1 ${f(x3)} ${f(y3)} L${f(x4)} ${f(y4)} A${r1} ${r1} 0 ${lg} 0 ${f(x1)} ${f(y1)} Z`};
const head=(x,y,dx,dy,c,s=7)=>{const l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l;return`<polygon points="${f(x+ux*s)},${f(y+uy*s)} ${f(x-uy*s*.7)},${f(y+ux*s*.7)} ${f(x+uy*s*.7)},${f(y-ux*s*.7)}" fill="${c}"/>`};
const TIERNAME={1:'Enveloped',2:'Vegetative',3:'Fungi',4:'Non-env.',5:'Mycobact.',6:'Spores'};
const TCOL=t=>`var(--s-${t})`,TSTROKE=t=>`var(--t-${t})`,TBG=t=>`var(--b-${t})`;
const italic=n=>/^C\. /.test(n);
const tickH=[[1,'1 h'],[24,'1 d'],[168,'1 wk'],[720,'1 mo'],[8760,'1 yr']];
const FEARC={red:'var(--bad)',amber:'var(--warn)',ok:'var(--ok)'};

/* master table: name,type,tier,route,lo,hi,kind,fear,space */
const ORG=[
 ['C. diff','spore',6,'enteric',3600,null,'single','red',1],
 ['TB','myco',5,'air',null,null,'none','red',3],
 ['Adenovirus','nonenv',4,'droplet',168,2160,'r','amber',2],
 ['HAV','nonenv',4,'enteric',2,1440,'r','amber',1],
 ['Norovirus','nonenv',4,'enteric',8,168,'r','amber',1],
 ['C. auris','fungi',3,'contact',336,null,'lb','red',1],
 ['Kleb (CPE)','veg',2,'contact',2,21900,'open','ok',1],
 ['Pseudomonas','veg',2,'contact',6,11680,'r','ok',1],
 ['MRSA','veg',2,'contact',168,5040,'r','ok',1],
 ['Acinetobacter','veg',2,'contact',72,3600,'r','ok',1],
 ['VRE','veg',2,'contact',120,2880,'r','ok',1],
 ['Legionella','veg',2,'water',4992,null,'lb','red',4],
 ['Mpox','env',1,'contact',264,720,'mp','amber',1],
 ['HBV','env',1,'blood',168,null,'lb','ok',1],
 ['Influenza','env',1,'droplet',24,48,'r','ok',2],
 ['Measles','env',1,'air',1,2,'air','red',3]
].map(a=>({n:a[0],t:a[1],tier:a[2],route:a[3],lo:a[4],hi:a[5],k:a[6],fear:a[7],sp:a[8]}));
const RANGE={'C. diff':'5 mo (single)','TB':'air route','Adenovirus':'7 d–3 mo','HAV':'2 h–60 d','Norovirus':'8 h–7 d','C. auris':'≥14 d','Kleb (CPE)':'2 h–>30 mo','Pseudomonas':'6 h–16 mo','MRSA':'7 d–7 mo','Acinetobacter':'3 d–5 mo','VRE':'5 d–4 mo','Legionella':'≥208 d (lab water)','Mpox':'11 d (22 °C)–30 d (4 °C)','HBV':'>1 wk','Influenza':'1–2 d','Measles':'2 h, room air'};

/* ---------- generic hub orbit (Obsidian style) ---------- */
function hubOrbit(o){
  const CX=640,CY=455,W=1280,H=910;let s=`<svg viewBox="0 0 ${W} ${H}" class="hl" role="img" aria-label="${o.aria}">`;
  o.rings.forEach(([r,lab])=>{s+=`<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="var(--line)" stroke-width="1.3" stroke-dasharray="3 6"/>`;
    const y=o.ringLabel==='bottom'?CY+r+18:CY-r-8;s+=`<text class="tf mono" x="${CX}" y="${y}" text-anchor="middle" font-size="13">${lab}</text>`});
  const pos={};o.nodes.forEach(n=>{pos[n[0]]=P(CX,CY,n[2],n[3])});
  const EC={G:'var(--good)',A:'var(--warn)',R:'var(--bad)'};
  o.edges.forEach(([h,n,st])=>{const[hx,hy]=o.hubs[h];const[nx,ny]=pos[n];const dx=nx-hx,dy=ny-hy,l=Math.hypot(dx,dy);
    const qx=(hx+nx)/2-dy/l*28,qy=(hy+ny)/2+dx/l*28;const g=st==='G';
    s+=`<path class="dimmable" data-h="${h}" data-n="${n}" d="M${hx} ${hy} Q${f(qx)} ${f(qy)} ${f(nx)} ${f(ny)}" fill="none" stroke="${EC[st]}" stroke-width="${g?1.8:2.4}" ${g?'':'stroke-dasharray="7 5"'} opacity="${g&&o.fadeGreen?.5:.9}"/>`});
  o.nodes.forEach(([name,t,r,a,air,size])=>{const[x,y]=pos[name];const rr=size||17;
    s+=`<g class="node dimmable" data-n="${name}" tabindex="0"><circle cx="${f(x)}" cy="${f(y)}" r="${f(rr)}" fill="${air?'var(--surface)':TBG(t)}" stroke="${TSTROKE(t)}" stroke-width="${air?2:1.5}" ${air?'stroke-dasharray="3 3"':''}/>`;
    const cls='tx'+(italic(name)?' it':'');
    if(r===0)s+=`<text class="${cls}" x="${f(x)}" y="${f(y+rr+24)}" text-anchor="middle" font-size="19">${name}</text>`;
    else{const sx=Math.sin(a*Math.PI/180);const st=sx>-0.15;s+=`<text class="${cls}" x="${f(x+(rr+8)*(st?1:-1))}" y="${f(y+6)}" text-anchor="${st?'start':'end'}" font-size="19">${name}${air&&o.airTag?' (air)':''}</text>`}
    s+=`</g>`});
  Object.entries(o.hubs).forEach(([h,[x,y,sub]])=>{s+=`<g class="node dimmable" data-h="${h}" tabindex="0"><rect x="${x-118}" y="${y-34}" width="236" height="68" rx="12" fill="var(--surface2)" stroke="var(--line)" stroke-width="1.3"/><text class="tx" x="${x}" y="${y-4}" text-anchor="middle" font-size="18" font-weight="700">${h}</text><text class="tm" x="${x}" y="${y+20}" text-anchor="middle" font-size="14">${sub}</text></g>`});
  return s+'</svg>';
}
function wireHover(root){const svg=root.querySelector('svg.hl');if(!svg)return;
  const set=(el)=>{const n=el.dataset.n,h=el.dataset.h;svg.classList.add('focus');
    svg.querySelectorAll('.dimmable').forEach(d=>{const on=(n&&(d.dataset.n===n))||(h&&(d.dataset.h===h))||
      (n&&d.dataset.h&&!d.dataset.n&&[...svg.querySelectorAll(`path[data-n="${CSS.escape(n)}"]`)].some(p=>p.dataset.h===d.dataset.h))||
      (h&&d.dataset.n&&!d.dataset.h&&[...svg.querySelectorAll(`path[data-h="${CSS.escape(h)}"]`)].some(p=>p.dataset.n===d.dataset.n));
      d.classList.toggle('on',!!on)})};
  const clr=()=>{svg.classList.remove('focus');svg.querySelectorAll('.on').forEach(d=>d.classList.remove('on'))};
  svg.querySelectorAll('.node').forEach(g=>{g.addEventListener('mouseenter',()=>set(g));g.addEventListener('focus',()=>set(g));g.addEventListener('mouseleave',clr);g.addEventListener('blur',clr)});
}
const HUBXY=[[150,95],[1130,95],[150,815],[1130,815]];

/* ---------- views ---------- */
const V={};
const shell=(o)=>`<div class="view-head"><div><div class="eyebrow">${o.eyebrow}</div><h2>${o.title}</h2><p class="q">${o.q}</p></div><span class="chip ${o.chipc||''}">${o.chip}</span></div>
<div class="layout${o.full?' full':''}"><div style="min-width:0"><div class="fig ${o.narrow?'narrow':''}">${o.fig}</div>${o.below||''}<p class="sources">${o.src}</p></div><aside class="side">${o.side}</aside></div>`;
const keyLines=(rows)=>`<div class="key">${rows.map(([c,t,solid])=>`<div><span class="ln ${solid?'solid':''}" style="border-color:${c}"></span>${t}</div>`).join('')}</div>`;
const keyTypes=()=>`<div class="key">${[['spore','Spores'],['myco','Mycobacteria'],['nonenv','Non-enveloped virus'],['fungi','Fungi'],['veg','Vegetative bacteria'],['env','Enveloped virus']].map(([t,l])=>`<div><span class="dot" style="background:${TBG(t)};border-color:${TSTROKE(t)}"></span>${l}</div>`).join('')}</div>`;

/* Orbit */
V.orbit=()=>{
  const TR={spore:0,myco:78,nonenv:140,fungi:200,veg:262,env:330};
  const N=[['C. diff','spore',0,3600],['TB','myco',225,2,1],['Adenovirus','nonenv',38,2160],['HAV','nonenv',95,1440],['Norovirus','nonenv',330,168],['C. auris','fungi',22,336],['Acinetobacter','veg',318,3600],['MRSA','veg',285,5040],['VRE','veg',250,2880],['Pseudomonas','veg',205,11680],['Kleb (CPE)','veg',165,21900],['Legionella','veg',125,4992],['Mpox','env',62,264],['HBV','env',145,168],['Influenza','env',188,48],['Measles','env',232,2,1]]
   .map(([n,t,a,h,air])=>[n,t,TR[t],a,!!air,air?11:9.5*Math.sqrt(L(h)+1)]);
  const hubs={'Alcohol hand rub':[...HUBXY[0],'Hand hygiene'],'Routine wipe (quat)':[...HUBXY[1],'Surface'],'Surgical mask':[...HUBXY[2],'Respiratory'],'Room cleaning':[...HUBXY[3],'Plumbing']};

V.views=()=>{
  const XM=LM+0.15,x0=150,xw=560,X=h=>x0+xw*L(h)/XM,RW=x0+xw+130,ST=19,PAD=12;

  for(let i=1;i<4;i++)s+=`<line x1="${sx0+i*cw}" y1="${F0}" x2="${sx0+i*cw}" y2="${bot}" stroke="var(--grid)" stroke-dasharray="2 4"/>`;
  const g3={};ORG.forEach(o=>{const k=o.sp+'-'+o.tier;(g3[k]=g3[k]||[]).push(o)});

    const cx=sx0+(o.sp-.5)*cw+(col-(inRow-1)/2)*17;const[y0,h]=fy[o.tier];const cy=y0+h/2+(row-(rows-1)/2)*17;const c=FEARC[o.fear];const air=o.k==='air'||o.k==='none';

  s+=`<circle cx="${kx+15}" cy="${my+94}" r="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/><text class="tm" x="${kx+40}" y="${my+98}" font-size="12.5">Airborne: no surface time</text>`;

   src:'Sources: Kramer 2006; Welsh 2017; Meister 2023; Mendis 2015; Lo 2026; CDC 2008 Fig. 1; CDC Appendix A; Kociolek 2023; Lionakis 2024.'})};
function bar3(o,y,w,X,label,fs=13){const c=FEARC[o.fear];let s='',e;
  if(o.k==='none'){s+=`<circle cx="${f(X(1))}" cy="${f(y)}" r="6" fill="var(--surface)" stroke="${c}" stroke-width="2"/>`;e=X(1)+6;if(label)s+=`<text class="tx" x="${f(e+8)}" y="${f(y+4)}" font-size="${fs}">TB (airborne; no surface time)</text>`;return s}
  if(o.k==='single'){const x=X(o.lo);s+=`<rect x="${f(x-6)}" y="${f(y-6)}" width="12" height="12" transform="rotate(45 ${f(x)} ${f(y)})" fill="${c}"/>`;e=x+8}
  else if(o.k==='lb'){const x=X(o.lo),x2=Math.min(x+60,X(26280));s+=`<line x1="${f(x)}" y1="${f(y)}" x2="${f(x2)}" y2="${f(y)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity=".3"/><line x1="${f(x)}" y1="${f(y)}" x2="${f(x+10)}" y2="${f(y)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;e=x2}
  else{const x1=X(o.lo),x2=X(o.hi||o.lo);s+=`<line x1="${f(x1)}" y1="${f(y)}" x2="${f(x2)}" y2="${f(y)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;e=x2;if(o.k==='open'){s+=head(x2+4,y,1,0,c,7);e+=10}}
  if(label)s+=`<text class="tx${italic(o.n)?' it':''}" x="${f(e+8)}" y="${f(y+4)}" font-size="${fs}">${o.n==='Measles'?'Measles (room air)':o.n}</text>`;
  return s}

  [5,4,3,2,1].forEach(t=>{s+=`<circle cx="${CX}" cy="${CY}" r="${SH[t]}" fill="none" stroke="var(--line)" stroke-width="1.2"/>`;const[x,y]=P(CX,CY,SH[t]-12,192);s+=`<text class="tf" x="${f(x)}" y="${f(y)}" font-size="13" text-anchor="end">T${t} ${['','enveloped virus','vegetative bacteria','fungi','non-enveloped virus','mycobacteria'][t]}</text>`});
  [30,230,275,330].forEach(a=>{const[x1,y1]=P(CX,CY,30,a),[x2,y2]=P(CX,CY,372,a);s+=`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="var(--line)" stroke-dasharray="2 6"/>`});
  [['DROPLET',0,392],['CONTACT',150,415],['WATER SYSTEM',252,398],['AIRBORNE',302,398]].forEach(([l,a,r])=>{const[x,y]=P(CX,CY,r,a);s+=`<text class="tm mono" x="${f(x)}" y="${f(y)}" text-anchor="middle" font-size="14" font-weight="600">${l}</text>`});
  const pos={};Q.forEach(q=>{pos[q[0]]=P(CX,CY,SH[q[1]],q[2])});
  E.forEach(([h,n,st])=>{const[hx,hy]=HUBS[h];const tx=hx-24;const[nx,ny]=pos[n];const dx=tx-nx,dy=hy-ny,l=Math.hypot(dx,dy);const qx=(tx+nx)/2-dy/l*30,qy=(hy+ny)/2+dx/l*30;

 {n:'C. diff',fr:'red',sc:'C. diff outbreak: hyperendemic unit, new case today.',res:'stool, surfaces',req:{surf:{'Bleach / sporicide':'B'},hands:{'Soap and water':'B','Alcohol rub':'H'}},why:'Spores: a sporicide (List K or 1:10 bleach) and soap and water in an outbreak. Alcohol is not sporicidal.'},
 {n:'C. auris',fr:'red',sc:'Transfer from a long-term acute care hospital, screen positive.',res:'skin, surfaces',req:{surf:{'List P product':'B','Bleach / sporicide':'B','Quat wipe':'H','Hospital wipe (List H)':'H'},hands:ALLH},why:'List P product (List K as fallback). Quat-only wipes are unreliable. Alcohol rub works on hands.'},
 {n:'MRSA',fr:'ok',sc:'Known MRSA colonization, admitted for cellulitis.',res:'skin, surfaces',req:{surf:{'Quat wipe':'B','Hospital wipe (List H)':'B','List P product':'B','Bleach / sporicide':'B'},hands:ALLH},why:'Routine tools work. MRSA spreads when a step is skipped.'},
 {n:'Mpox',fr:'amber',sc:'Vesicular rash on the hands and genitals.',res:'lesions, linen',req:{surf:{'Bleach / sporicide':'B','Quat wipe':'L','Hospital wipe (List H)':'L','List P product':'L'},hands:ALLH,mask:{'N95':'B','Surgical mask':'L'}},why:'Lesions shed onto linen and surfaces. Hypochlorite and alcohol-based products worked in the lab; an H2O2 product did not. Confirm current CDC PPE guidance.'},
 {n:'Legionella',fr:'red',sc:'Two hospital-onset Legionnaires’ cases on one floor.',res:'plumbing',req:{room:{'Water program':'B'}},why:'It lives in the pipes. Only a building water-management program reaches it.'},
 {n:'Klebsiella (CPE)',fr:'ok',sc:'KPC Klebsiella in the urine; a sink sits beside the bed.',res:'sink drains',req:{room:{'Water program':'B','Standard room':'L','AIIR':'L'},surf:{'Quat wipe':'B','Hospital wipe (List H)':'B','List P product':'B','Bleach / sporicide':'B'},hands:ALLH},why:'Contact precautions work on surfaces and hands, but drains reseed. Sink and drain management closes the loop.'},
 {n:'Adenovirus',fr:'amber',sc:'Adenovirus pneumonia on a transplant ward.',res:'respiratory, surfaces',req:{surf:{'Bleach / sporicide':'B','Quat wipe':'L','Hospital wipe (List H)':'L','List P product':'L'},hands:{'Soap and water':'B','Alcohol rub':'L'},mask:{'Surgical mask':'B','N95':'B'}},why:'Droplet plus contact. A non-enveloped virus: chlorine works, quat-only and alcohol are weaker.'}];
const GST={deck:[],i:0,score:0,lives:3,streak:0,busy:false,pick:{room:'Standard room',surf:'Quat wipe',hands:'Alcohol rub',mask:'None'},done:false,over:false,log:[]};
let gRaf;
const gBest=()=>{try{return+localStorage.getItem('atlas-best')||0}catch(e){return 0}};
function gNew(){GST.deck=GAME.map((g,i)=>i).sort(()=>Math.random()-.5).slice(0,10);GST.i=0;GST.score=0;GST.lives=3;GST.streak=0;GST.done=false;GST.over=false;GST.log=[];gReset()}
function gReset(){GST.pick={room:'Standard room',surf:'Quat wipe',hands:'Alcohol rub',mask:'None'};GST.done=false}
V.game=()=>shell({eyebrow:'Game · Choose the precaution',title:'Precaution game',q:'Ten patients. Each starts with the routine kit: standard room, quat wipe, alcohol rub, no mask. Upgrade what the pathogen needs, then run the shift. Overkill costs points; a spread costs a life.',chip:'Game',chipc:'inter',narrow:true,
  fig:`<div id="gbar" class="ctrls" style="justify-content:space-between"></div><div id="gbody"></div>`,
  side:`<div><h3>Scoring</h3><ul><li>Stopped: +100, plus 20 per streak step</li><li>Leaked (product-dependent): +40, streak resets</li><li>Spread: 0 and lose a life</li><li>Overkill: −15 for an AIIR or N95 the pathogen does not need, −10 for an unneeded water program</li><li>Busy shift: one hand or surface step may be skipped at random; points ×1.5</li></ul></div>
  <div><h3>Slices</h3><div class="key"><div><span class="sw" style="background:var(--good)"></span>Blocks</div><div><span class="sw" style="background:var(--warn)"></span>Leaks</div><div><span class="sw" style="background:var(--bad)"></span>Hole</div><div><span class="sw" style="border:1.5px dashed var(--faint)"></span>Not this route</div></div></div>
  <div class="note">Routes are scored in parallel: every route the pathogen uses has to be covered. Teaching model, not a protocol; follow your institution's policy.</div>`,
  src:'Sources: CDC Appendix A; Kociolek 2023; Lionakis 2024; Hall 2011; Meister 2023; Mendis 2015; Lo 2026; Kramer 2006.'});
function gEval(g){const st={},lab={};GSL.forEach(([k])=>{const r=g.req[k];if(!r){st[k]='N';lab[k]='not this route';return}st[k]=r[GST.pick[k]]||'H';lab[k]=GST.pick[k]});
  let skipped=null;if(GST.busy&&Math.random()<.3){const c=['surf','hands'].filter(k=>st[k]==='B');if(c.length){skipped=c[Math.floor(Math.random()*c.length)];st[skipped]='H';lab[skipped]='Skipped (busy shift)'}}
  const v=Object.values(st);const out=v.includes('H')?'spread':v.includes('L')?'leak':'stop';
  let pen=[];if(GST.pick.room==='AIIR'&&!g.air)pen.push(['AIIR not needed',-15]);if(GST.pick.mask==='N95'&&!(g.req.mask&&g.req.mask['N95']==='B'&&!g.req.mask['Surgical mask']))pen.push(['N95 not needed',-15]);
  if(GST.pick.room==='Water program'&&!(g.req.room&&g.req.room['Water program']))pen.push(['Water program not needed',-10]);
  if(g.n==='Mpox'&&GST.pick.mask==='N95')pen=pen.filter(p=>p[0]!=='N95 not needed');
  return{st,lab,out,pen,skipped}}
function gBar(){const b=document.getElementById('gbar');if(!b)return;const best=Math.max(gBest(),GST.score);
  b.innerHTML=`<div style="display:flex;gap:18px;flex-wrap:wrap;font-family:var(--font-mono);font-size:13px"><span>SCORE <b style="color:var(--fg);font-size:18px">${GST.score}</b></span><span>PATIENT <b style="color:var(--fg)">${Math.min(GST.i+1,10)}/10</b></span><span>LIVES <b style="color:var(--bad);letter-spacing:2px">${'●'.repeat(GST.lives)}<span style="opacity:.25">${'●'.repeat(3-GST.lives)}</span></b></span><span>STREAK <b style="color:var(--fg)">${GST.streak}</b></span><span>BEST <b style="color:var(--fg)">${best}</b></span></div>
  <label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)"><input type="checkbox" id="gbusy" ${GST.busy?'checked':''}> Busy shift ×1.5</label>`;
  document.getElementById('gbusy').onchange=e=>{GST.busy=e.target.checked}}
function gRender(){gBar();const body=document.getElementById('gbody');if(!body)return;
  if(GST.over){const best=gBest();body.innerHTML=`<div class="panel" style="text-align:center;padding:28px"><div class="eyebrow">Shift over</div><div style="font-family:var(--font-display);font-size:52px;font-weight:700">${GST.score}</div><p class="q" style="margin:4px auto 14px">${GST.lives>0?'All ten patients handled.':'Out of lives.'} Best: ${best}</p>
    <div style="text-align:left;max-width:560px;margin:0 auto 16px;display:flex;flex-direction:column;gap:4px">${GST.log.map(l=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding:4px 0"><span>${l[0]}</span><span style="color:${l[1]==='stop'?'var(--good)':l[1]==='leak'?'var(--warn)':'var(--bad)'}">${l[1]==='stop'?'Stopped':l[1]==='leak'?'Leaked':'Spread'} · ${l[2]>0?'+':''}${l[2]}</span></div>`).join('')}</div>
    <button class="pill" id="gagain" aria-pressed="true">Play again</button></div>`;document.getElementById('gagain').onclick=()=>{gNew();gRender()};return}
  const g=GAME[GST.deck[GST.i]];
  body.innerHTML=`<div class="panel" style="margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><div class="lab">Patient ${GST.i+1}</div><div style="font-size:16px">${g.sc}</div></div><div style="font-family:var(--font-display);font-size:22px;font-weight:700;color:${GST.done?FEARC[g.fr]:'var(--muted)'}">${GST.done?g.n:'Diagnosis?'}</div></div>
  ${GSL.map(([k,lab,opts])=>`<div class="ctrls" style="margin-bottom:6px"><span class="lab" style="min-width:64px">${lab}</span>${opts.map(o=>`<button class="pill" data-gk="${k}" data-gv="${o}" aria-pressed="${GST.pick[k]===o}" ${GST.done?'disabled':''}>${o}</button>`).join('')}</div>`).join('')}
  <svg id="gsvg" viewBox="0 0 680 220" role="img" aria-label="Barrier lane result" style="margin-top:6px"></svg>
  <div id="gres"></div>
  <div class="ctrls" style="margin-top:10px">${GST.done?`<button class="pill" id="gnext" aria-pressed="true">${GST.i>=9||GST.lives<=0?'See results':'Next patient'}</button>`:`<button class="pill" id="grun" aria-pressed="true">Run the shift</button>`}<button class="pill" id="grestart">Restart</button></div>`;
  body.querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{GST.pick[b.dataset.gk]=b.dataset.gv;gRender()});
  document.getElementById('grestart').onclick=()=>{gNew();gRender()};
  if(GST.done){document.getElementById('gnext').onclick=()=>{if(GST.i>=9||GST.lives<=0){GST.over=true;try{if(GST.score>gBest())localStorage.setItem('atlas-best',GST.score)}catch(e){}}else{GST.i++;gReset()}gRender()};gLane(GST.last,false);gResult(g,GST.last)}
  else{gLane(null,false);document.getElementById('grun').onclick=()=>{const r=gEval(g);let pts=r.out==='stop'?100+20*GST.streak:r.out==='leak'?40:0;r.pen.forEach(p=>pts+=p[1]);if(GST.busy&&pts>0)pts=Math.round(pts*1.5);
    if(r.out==='stop')GST.streak++;else GST.streak=0;if(r.out==='spread')GST.lives--;r.pts=pts;GST.score+=pts;GST.last=r;GST.done=true;GST.log.push([g.n,r.out,pts]);gRender();gLane(r,true)}}}
function gLane(r,anim){const svg=document.getElementById('gsvg');if(!svg)return;const X=[190,300,410,520],NM=['Room','Surface','Hands','Mask'],K=['room','surf','hands','mask'];
  let h=`<rect x="8" y="64" width="92" height="80" rx="8" fill="var(--surface2)" stroke="var(--line)"/><text class="tx" x="54" y="100" text-anchor="middle" font-size="14" font-weight="600">Reservoir</text><text class="tm" x="54" y="120" text-anchor="middle" font-size="11">${r?GAME[GST.deck[GST.i]].res:'?'}</text>
  <rect x="580" y="64" width="92" height="80" rx="8" fill="var(--surface2)" stroke="var(--line)"/><text class="tx" x="626" y="100" text-anchor="middle" font-size="14" font-weight="600">Spread</text><text class="tm" x="626" y="120" text-anchor="middle" font-size="11">next host</text><line x1="100" y1="104" x2="580" y2="104" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  K.forEach((k,i)=>{const x=X[i]-13;const s=r?r.st[k]:'?';h+=`<text class="tm" x="${X[i]}" y="34" text-anchor="middle" font-size="12.5">${NM[i]}</text>`;
    if(s==='B')h+=`<rect x="${x}" y="44" width="26" height="120" rx="6" fill="var(--good)" opacity=".85"/>`;
    else if(s==='H')h+=`<rect x="${x}" y="44" width="26" height="44" rx="6" fill="var(--bad)" opacity=".85"/><rect x="${x}" y="120" width="26" height="44" rx="6" fill="var(--bad)" opacity=".85"/>`;
    else if(s==='L')h+=`<rect x="${x}" y="44" width="26" height="54" rx="6" fill="var(--warn)" opacity=".85"/><rect x="${x}" y="110" width="26" height="54" rx="6" fill="var(--warn)" opacity=".85"/>`;
    else if(s==='N')h+=`<rect x="${x}" y="44" width="26" height="120" rx="6" fill="none" stroke="var(--faint)" stroke-dasharray="2 3"/>`;
    else h+=`<rect x="${x}" y="44" width="26" height="120" rx="6" fill="var(--surface2)" stroke="var(--line)"/><text class="tf" x="${X[i]}" y="109" text-anchor="middle" font-size="16">?</text>`;
    h+=`<text class="tm" x="${X[i]}" y="186" text-anchor="middle" font-size="11.5">${r?r.lab[k]:GST.pick[k]}</text>`});
  h+=`<circle id="gdot" cx="100" cy="104" r="9" fill="var(--bad)" stroke="var(--surface)" stroke-width="2"/>`;svg.innerHTML=h;if(!r)return;
  const st=K.map(k=>r.st[k]);const lastB=st.lastIndexOf('B');const end=r.out==='spread'||r.out==='leak'&&lastB<0?600:X[Math.max(lastB,0)]-24;
  const dot=document.getElementById('gdot');let x=100,rad=9;cancelAnimationFrame(gRaf);
  if(!anim||matchMedia('(prefers-reduced-motion: reduce)').matches){st.forEach((s,i)=>{if(s==='L'&&X[i]<end)rad=Math.max(5,rad-2)});dot.setAttribute('cx',end);dot.setAttribute('r',rad);return}
  (function step(){x+=5;st.forEach((s,i)=>{if(s==='L'&&Math.abs(x-X[i])<3)rad=Math.max(5,rad-2)});if(x>=end)x=end;dot.setAttribute('cx',x);dot.setAttribute('r',rad);if(x<end)gRaf=requestAnimationFrame(step)})()}
function gResult(g,r){const el=document.getElementById('gres');const c=r.out==='stop'?'var(--good)':r.out==='leak'?'var(--warn)':'var(--bad)';
  el.innerHTML=`<div class="cards2"><div class="panel"><div class="lab">Outcome</div><div style="font-weight:700;color:${c};font-size:17px">${r.out==='stop'?'Stopped':r.out==='leak'?'Leaked: reduced, not stopped':'Spread to the next host'} · ${r.pts>0?'+':''}${r.pts}</div>${r.skipped?`<div style="color:var(--bad);font-size:13.5px">Busy shift: the ${r.skipped==='surf'?'surface wipe':'hand hygiene'} step was skipped.</div>`:''}${r.pen.map(p=>`<div style="color:var(--muted);font-size:13.5px">${p[0]} ${p[1]}</div>`).join('')}</div>
  <div class="panel"><div class="lab">Right kit</div><div style="font-size:14px">${g.why}</div></div></div>`}
function gWire(){if(!GST.deck.length)gNew();gRender()}

/* Home */
const TABS=[['home','Home'],null,['orbit','Orbit'],['ppe','PPE'],['agents','Agents'],['views','Three views'],null,['game','Precaution game'],['sim','Barrier sim'],['shield','Shield'],['human','Human factor'],null,['rings','Precaution rings'],['route','Route × time'],['lasting','Lasting vs tough'],['failure','Failure map'],['rose','Rose']];
const CARDS={final:[['orbit','Where routine practice misses','Tools as hubs, pathogens in resistance orbits. The original sketch, finished.'],['ppe','What your PPE protects you from','Gloves, masks, N95: which pathogens each one covers.'],['agents','What each agent kills','Alcohol, quats, bleach, peroxide against the resistance ladder.'],['views','Space, time, disinfectant, fear','Three orthographic views of one object, colored by what routine practice misses.']],
inter:[['game','Precaution game','Ten patients, one kit each. Choose the precaution, keep your lives, track your score.'],['sim','Barrier simulator','Swiss-cheese lane with kit and skipped-step toggles.'],['shield','Barrier shield','The slices wrapped into rings; sectors sized by persistence.'],['human','Human multiplier','Slide compliance and watch the red blocks grow.']],
old:[['rings','Precaution rings','Rings by precaution level, tails by persistence, numbered concerns.'],['route','Survival time by route','The first axis sketch: time against route.'],['lasting','Lasting vs tough','Persistence ranges grouped by resistance tier.'],['failure','Barrier failure map','Every barrier against every organism.'],['rose','Persistence rose','Nightingale-style rose. Superseded.']]};
V.home=()=>`<section class="hero"><div><div class="eyebrow">Malevolent Microbes · Isolation precautions, Part 3</div><h1>Back to the <em>1850s</em>?</h1><p>What we cannot see on surfaces, in water and on hands can harm us or the next patient in the bed. These models show how long each pathogen lasts, how hard it is to kill, how far it travels, and where our routine tools miss.</p></div>
<div class="ledger"><span>Organisms</span><b>16</b><span>Barriers</span><b>hand rub · wipe · mask · N95 · water</b><span>Pooled prior-occupant OR</span><b>2.14 (95% CI 1.65–2.77)</b><span>Reported compliance</span><b>~50%</b><span>From</span><b><a href="https://malevolentmicrobes-stack.github.io/cozy-arcade-app/" target="_blank" rel="noopener" style="color:var(--accent)">Malevolent Microbes ↗</a></b></div></section>
<div class="wash" style="margin-top:0;margin-bottom:6px"><div><h2>Wash your hands.</h2><p>Every reservoir reaches the next patient through someone’s hands. For most organisms on these maps, the failure is the step that was skipped.</p></div><div style="display:flex;flex-wrap:wrap;gap:8px"><a class="pill" href="https://drive.google.com/drive/folders/1tIHsj1wlFJybXVV-rlcoX8nUilOycX1b?usp=sharing" target="_blank" rel="noopener" style="background:transparent;color:var(--bg);border-color:var(--bg);text-decoration:none">Malevolent Resources and Musings ↗</a><a class="pill" href="#orbit" style="background:var(--bg);color:var(--fg);text-decoration:none">Open the orbit</a></div></div>
${QUANTUM()}
${[['final','Final models','final','Final'],['inter','Interactive','inter','Interactive'],['old','Explored along the way','old','Explored']].map(([k,h,c,lab])=>`<div class="group"><h2>${h}</h2><div class="grid">${CARDS[k].map(([id,t,d])=>`<a class="card" href="#${id}"><div class="row"><h3>${t}</h3><span class="chip ${c}">${lab}</span></div><p>${d}</p></a>`).join('')}</div></div>`).join('')}
`;

/* ---------- router & theme ---------- */
const tabs=document.getElementById('tabs');
tabs.innerHTML=TABS.map(t=>t?`<a href="#${t[0]}" data-id="${t[0]}">${t[1]}</a>`:'<span class="sep" aria-hidden="true"></span>').join('');
function route(){let id=(location.hash||'#home').slice(1);if(!V[id])id='home';
  const m=document.getElementById('main');m.innerHTML=V[id]();window.scrollTo(0,0);
  tabs.querySelectorAll('a').forEach(a=>{if(a.dataset.id===id){a.setAttribute('aria-current','page');a.scrollIntoView({block:'nearest',inline:'nearest'})}else a.removeAttribute('aria-current')});
  wireHover(m);if(id==='sim')simWire();if(id==='shield')shWire();if(id==='human')humWire();if(id==='game')gWire()}
addEventListener('hashchange',route);
const root=document.documentElement,tb=document.getElementById('theme'),tl=document.getElementById('themeLab');
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const syncLab=()=>{tl.textContent=isDark()?'Light':'Dark'};
if(!root.dataset.theme)root.dataset.theme='dark';
tb.onclick=()=>{const n=isDark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('atlas-theme2',n)}catch(e){}syncLab()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncLab);
syncLab();route();
</script>
